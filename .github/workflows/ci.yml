name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/replay_public_results.py
      - run: uv run python scripts/check_publication.py
