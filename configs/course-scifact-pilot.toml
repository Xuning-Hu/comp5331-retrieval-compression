[data]
name = "scifact"

[embedding]
device = "cuda"
batch_size = 16

[experiment]
output = "runs/course-scifact-pilot"
methods = ["original", "pca", "rp", "ae", "rae", "qrae", "rank_only"]
dimensions = [128]
seeds = [42]
split = "dev"

[ae]
steps = 1000

[neural]
steps = 1000
regularization_weight = 0.0001
ranking_weight = 1.0
margin = 0.1

[supervision]
negative_strategy = "random"
